name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend / Python ${{ matrix.python-version }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Import application
        run: python -c "import app.main; print('app import ok')"
      - name: Verify safe feature-gate default
        run: python -c "from app.config import settings; assert settings.enable_derived_listening_metrics is False"
      - name: Run tests
        run: python -m pytest -q

  frontend:
    name: Frontend / Node 20
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm install
      - name: Build frontend
        run: npm run build
